name: Windows local connector
on:
  push:
    branches: [main]
    paths:
      - 'local_connector/**'
      - '.github/workflows/local-connector.yml'
  pull_request:
    paths:
      - 'local_connector/**'
      - '.github/workflows/local-connector.yml'
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test Windows PowerShell 5.1 with synthetic certificates
        shell: powershell
        run: .\local_connector\tests\Test-Connector.ps1
