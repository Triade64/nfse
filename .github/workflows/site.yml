name: Site (backend e frontend)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency audit, to catch vulnerabilities published after the last change.
    - cron: '0 11 * * 1'
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependências iguais em requirements.txt e pyproject.toml (Vercel)
        run: python scripts/check_dependencies.py
      - name: Instalar
        run: python -m pip install -r requirements-dev.txt pip-audit==2.10.1
      - name: Testes do backend
        env:
          PYTHONPATH: backend
        run: python -m pytest -q -p no:warnings backend/tests
      - name: Vulnerabilidades conhecidas (Python)
        run: python -m pip_audit -r requirements.txt
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        run: npm ci
      - name: Testes do frontend
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Vulnerabilidades conhecidas (npm)
        run: npm audit --omit=dev --audit-level=moderate
